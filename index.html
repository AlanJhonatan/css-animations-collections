<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>css-animations-collections</title>
  </head>
  <body>
    <div id="app">
      <div class="progress-bar"></div>
      <div class="header">
        <div class="header__container">
          <div class="header__letters">
            <span>T</span>
            <span>h</span>
            <span>i</span>
            <span>s</span>
            <span>&nbsp;</span>
            <span>i</span>
            <span>s</span>
            <span>&nbsp;</span>
            <span>f</span>
            <span>u</span>
            <span>l</span>
            <span>l</span>
            <span>&nbsp;</span>
            <span>t</span>
            <span>e</span>
            <span>x</span>
            <span>t</span>
            <span>.</span>
          </div>
        </div>
      </div>
      <div class="block pin">
        <div class="sticky">
          <h2>This page is locked until you scroll enough.</h2>
          <div class="circle"><p>rotate</p></div>
        </div>
      </div>
      <div class="block"></div>
      <div class="number-container">
        <div class="number-container__inner">
          <div class="number-container__data" data-value="999"></div>
        </div>
      </div>
      <div class="block"></div>

      <div class="graph-block">
        <div class="graph" data-total="500">
          <div class="graph__row" data-number="250">
            <span class="graph__year">2021</span>
            <div class="graph__bar"></div>
            <div class="graph__number"></div>
          </div>
          <div class="graph__row" data-number="350">
            <span class="graph__year">2022</span>
            <div class="graph__bar"></div>
            <div class="graph__number"></div>
          </div>
          <div class="graph__row" data-number="500">
            <span class="graph__year">2023</span>
            <div class="graph__bar"></div>
            <div class="graph__number"></div>
          </div>
          <div class="graph__row" data-number="100">
            <span class="graph__year">2024</span>
            <div class="graph__bar"></div>
            <div class="graph__number"></div>
          </div>
          <div class="graph__row" data-number="150">
            <span class="graph__year">2025</span>
            <div class="graph__bar"></div>
            <div class="graph__number"></div>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
